[package]
name = "implshare"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
syn = { version = "^2", features = ["full", "parsing"] }
lazy_static = "^1.4.0"
proc-macro2 = { version = "1.0.32", default-features = false }
rand = "^0.8.5"
bytes = "^0.5.3"
chrono = "^0.4.0"
regex = "^1"

